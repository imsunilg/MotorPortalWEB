@if (open) {
  <div class="confirm-backdrop" (click)="cancelled.emit()">
    <div class="confirm-box mp-card" (click)="$event.stopPropagation()">
      <h3>{{ title }}</h3>
      <p>{{ message }}</p>
      <div class="confirm-actions">
        <button type="button" class="mp-btn-secondary" (click)="cancelled.emit()">
          {{ cancelLabel }}
        </button>
        <button type="button" class="mp-btn-primary" (click)="confirmed.emit()">
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
