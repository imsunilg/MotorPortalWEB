<div class="login-page">
  <div class="login-card">
    <h1 class="brand">Motor Portal</h1>

    <div class="sample-credentials">
      <span class="sample-credentials-label">Sample login</span>
      <span class="sample-credentials-value">Login ID: <strong>admin</strong> &nbsp;·&nbsp; Password: <strong>admin123</strong></span>
      <button type="button" class="sample-credentials-fill" (click)="useSampleCredentials()">
        Use sample login
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="username">Login ID</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          [class.invalid]="username.invalid && username.touched"
        />
        @if (username.invalid && username.touched) {
          <span class="field-error">Login ID is required.</span>
        }
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [class.invalid]="password.invalid && password.touched"
        />
        @if (password.invalid && password.touched) {
          <span class="field-error">Password is required.</span>
        }
      </div>

      @if (errorMessage()) {
        <div class="form-error">{{ errorMessage() }}</div>
      }

      <button type="submit" class="mp-btn-primary sign-in-btn" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Signing in...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>

      <a class="forgot-link" href="javascript:void(0)">Forgot Password?</a>
    </form>
  </div>
</div>
